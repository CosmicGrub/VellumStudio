# Single source of truth for the app version. app/build.gradle.kts reads BOTH keys from here, so a
# release bump is a one-line change in ONE file (and one merge across main / the two device
# branches) instead of the three hand-edited commits it used to be (0.2.1 was bumped as a88e7a9 /
# ec098d1 / 78b7349). versionCode must strictly increase with every build that is ever installed
# over a previous one; versionName is the human-readable label used in APK names and the About text.
# Plain key=value, no quotes, no spaces around the '='.
versionCode=3
versionName=0.2.1

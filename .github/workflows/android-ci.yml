name: Android CI

# Runs the tablet-app's unit test suite, lint, and a debug assembly on every push/PR to main and
# to either device/* branch (device/galaxy-tab-s9fe, device/galaxy-z-fold5). Any of the three
# gradle tasks failing fails the whole workflow -- there's no continue-on-error anywhere here.
"on":
  push:
    branches:
      - main
      - "device/*"
  pull_request:
    branches:
      - main
      - "device/*"

defaults:
  run:
    # gradlew and the :app module both live under tablet-app/, not the repo root
    # (pc-companion/ is the unrelated .NET WPF app alongside it).
    working-directory: tablet-app

jobs:
  build:
    name: Unit tests, lint, and debug build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # tablet-app/local.properties is machine-local and gitignored (see tablet-app/.gitignore),
      # so it never exists on a fresh CI checkout -- android-actions/setup-android exports
      # ANDROID_HOME/ANDROID_SDK_ROOT instead, which AGP falls back to automatically.

      - name: Run unit tests (:app:testDebugUnitTest)
        run: ./gradlew :app:testDebugUnitTest --console=plain --no-daemon

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: tablet-app/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

      - name: Run lint (:app:lint)
        run: ./gradlew :app:lint --console=plain --no-daemon

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: |
            tablet-app/app/build/reports/lint-results-debug.html
            tablet-app/app/build/reports/lint-results-debug.xml
          if-no-files-found: ignore

      - name: Assemble debug APK (:app:assembleDebug)
        run: ./gradlew :app:assembleDebug --console=plain --no-daemon
